# 1. 强制提交到你自己的 master 分支
settings:
  git:
    branch: master

# 2. 图片/媒体文件上传路径
media:
  input: public/images
  output: /images

# 3. 内容与配置映射
content:
  # --------------------------------------------------
  # A. 博客文章 (对应 src/content/posts 目录)
  # --------------------------------------------------
  - name: posts
    label: 📝 博客文章
    type: collection
    path: src/content/posts
    extension: md
    format: yaml-frontmatter
    view:
      fields: [title, published, draft, category]
      primary: title
      sort: [published]
      order: desc
    fields:
      - name: title
        label: 文章标题
        type: string
        required: true

      - name: published
        label: 发布日期
        type: date
        required: true

      - name: description
        label: 文章摘要
        type: text

      - name: image
        label: 文章封面图
        type: image

      - name: tags
        label: 标签
        type: list
        field:
          type: string

      - name: category
        label: 分类
        type: string

      - name: draft
        label: 是否草稿
        type: boolean
        default: false

      - name: body
        label: 正文内容
        type: rich-text

  # --------------------------------------------------
  # B. 站点配置文件 (对应 src/config 目录)
  # --------------------------------------------------
  - name: site_config
    label: ⚙️ 站点基本配置 (siteConfig.ts)
    type: file
    path: src/config/siteConfig.ts
    format: raw
    fields:
      - name: body
        label: siteConfig.ts 代码内容
        type: code

  - name: profile_config
    label: 👤 个人与社交配置 (profileConfig.ts)
    type: file
    path: src/config/profileConfig.ts
    format: raw
    fields:
      - name: body
        label: profileConfig.ts 代码内容
        type: code