# 1. 全局 Git 提交策略：强制提交到你自己的 master 分支
settings:
  git:
    branch: master

# 2. 静态媒体文件存储配置
media:
  input: public/images
  output: /images

# 3. 内容与文件结构映射
content:
  # 博客文章列表 (对应 src/content/posts)
  - name: posts
    label: 📝 博客文章
    type: collection
    path: src/content/posts
    extension: md
    format: yaml-frontmatter
    view:
      fields: [title, published, draft]
      primary: title
      sort: [published]
      order: desc
    fields:
      - name: title
        label: 文章标题
        type: string
        required: true

      - name: published
        label: 发布时间
        type: date
        required: true

      - name: description
        label: 文章摘要
        type: text

      - name: image
        label: 封面图片
        type: image

      - name: tags
        label: 标签
        type: list
        field:
          type: string

      - name: category
        label: 分类
        type: string

      - name: draft
        label: 是否草稿
        type: boolean
        default: false

      - name: body
        label: 正文内容
        type: rich-text

  # 特殊独立页面 (对应 src/content/spec，如 about、links 等)
  - name: spec_pages
    label: 📄 特殊/独立页面
    type: collection
    path: src/content/spec
    extension: md
    format: yaml-frontmatter
    fields:
      - name: title
        label: 页面标题
        type: string
        required: true

      - name: description
        label: 页面描述
        type: text

      - name: body
        label: 页面正文
        type: rich-text

  # Public 目录文件上传 (可以直接向 public/ 目录上传 PDF、Zip、附件等)
  - name: public_files
    label: 📁 Public 静态文件上传
    type: collection
    path: public
    fields:
      - name: file
        label: 上传文件到 public 根目录
        type: file